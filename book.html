<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="telegram-web-app.js"></script>
<title>Запись на созвон</title>
<style>
/* Экран записи на созвон (клиент) и расписание менеджера (?m=mgr). Открывается кнопкой из бота поверх чата.
   Данные берёт у бота (Cloudflare Worker, адрес /api), подпись Telegram проверяет бот. Без Telegram работает как демо. */
@font-face{font-family:"Geologica";src:url(Geologica-Light.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Geologica";src:url(Geologica-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geologica";src:url(Geologica-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geologica";src:url(Geologica-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--green:#009560;--dark:#00613F;--cream:#FFF5E7;--ink:#202020;--grey:#565656;--line:rgba(0,97,63,.12);
 --off:repeating-linear-gradient(135deg,rgba(0,97,63,.10) 0 2px,rgba(0,97,63,.02) 2px 8px);
 --closed:repeating-linear-gradient(135deg,rgba(222,72,0,.18) 0 2px,rgba(222,72,0,.04) 2px 8px);
 --font:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--cream);color:var(--ink);overflow-x:clip}
body{font:15px/1.45 var(--font);min-height:100vh;padding:0 max(14px,env(safe-area-inset-right)) 130px max(14px,env(safe-area-inset-left));
 background-image:radial-gradient(40% 24% at 95% 4%,rgba(0,149,96,.18),rgba(0,149,96,0)),radial-gradient(36% 22% at 4% 60%,rgba(0,149,96,.10),rgba(0,149,96,0))}
.wrap{max-width:720px;margin:0 auto;padding-top:16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-weight:500;font-size:25px;line-height:1.15;color:var(--dark)}
.lead{margin:0;color:var(--grey);font-weight:300;font-size:14.5px}
.bar{display:flex;align-items:center;gap:8px}
.nav{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.95);color:var(--dark);font-size:20px;box-shadow:0 4px 12px rgba(0,60,40,.06)}
.nav:disabled{opacity:.3;cursor:default}
.range{flex:1;font-weight:500;font-size:16px;color:var(--dark)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--grey);flex-wrap:wrap}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.card{background:linear-gradient(135deg,rgba(255,255,255,.45),rgba(255,255,255,.15) 60%,rgba(255,255,255,.3));border:1.5px solid rgba(255,255,255,.9);border-radius:18px;padding:8px 6px 10px 2px;box-shadow:0 10px 26px rgba(0,60,40,.08)}
.grid{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr));column-gap:4px}
.dh{text-align:center;padding:4px 0 8px;font-size:12px;color:var(--grey);line-height:1.15;border-radius:10px}
.dh b{display:block;font-size:17px;font-weight:500;color:var(--ink)}
.dh.today b{color:#fff;background:var(--green);border-radius:999px;width:30px;height:30px;line-height:30px;margin:2px auto 0}
.dh.act{cursor:pointer}.dh.act:hover{background:rgba(0,149,96,.08)}
.tm{font-size:10.5px;color:var(--grey);text-align:right;padding-right:5px;transform:translateY(-7px);height:34px}
.tm sup{font-size:7.5px}
.c{all:unset;box-sizing:border-box;height:30px;margin-bottom:4px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;overflow:hidden;white-space:nowrap;background:var(--off)}
.c.free{background:rgba(255,255,255,.85);border-color:rgba(0,97,63,.16);cursor:pointer;color:transparent}
.c.free:hover{border-color:var(--green);color:var(--green)}
.c:focus-visible{outline:3px solid #DE4800;outline-offset:1px}
.c.sel{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.c.closed{background:var(--closed);border-color:rgba(222,72,0,.25);color:#B33A00;cursor:pointer}
.c.booked{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:600;cursor:pointer;font-size:10.5px}
.c.hold{background:rgba(0,97,63,.35);color:#fff;cursor:pointer}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:rgba(255,245,231,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
.foot .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.pick{font-size:14px;color:var(--grey);text-align:center;white-space:pre-line}.pick b{color:var(--dark)}
.btn{font:600 16px var(--font);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--green);color:#fff;width:100%}
.btn:disabled{background:rgba(0,97,63,.18);color:rgba(0,97,63,.6);cursor:default}
.msg{text-align:center;padding:40px 10px;color:var(--grey)}
.demo{font-size:12px;color:var(--grey);text-align:center}
@media (min-width:560px){.c{height:34px}.tm{height:38px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h"></h1>
  <p class="lead" id="ld"></p>
  <div class="bar"><button class="nav" id="prev" aria-label="Предыдущая неделя">‹</button><div class="range" id="range"></div><button class="nav" id="next" aria-label="Следующая неделя">›</button></div>
  <div class="legend" id="lg"></div>
  <div class="card"><div class="grid" id="grid"><div class="msg" style="grid-column:1/-1">Загружаем свободное время…</div></div></div>
  <p class="demo" id="demo" hidden>Демо: вне Telegram данные выдуманные, запись никуда не уходит.</p>
</div>
<div class="foot"><div class="in"><div class="pick" id="pick"></div><button class="btn" id="go"></button></div></div>
<script>
const API="https://vyau-bot.vse-ya-uvolnays.workers.dev/api";
const TG=window.Telegram&&window.Telegram.WebApp, INIT=TG&&TG.initData||"";
const MGR=/[?&]m=mgr/.test(location.search), DEMO=!INIT;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor("#FFF5E7");TG.setBackgroundColor("#FFF5E7")}catch(e){}}
const $=id=>document.getElementById(id);
const WD=["вс","пн","вт","ср","чт","пт","сб"],MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MSK=3*3600000,DAY=86400000;
const mskD=ms=>new Date(ms+MSK);                        // дата «по Москве» в UTC-полях
const dayStart=ms=>Math.floor((ms+MSK)/DAY)*DAY-MSK;
const hm=ms=>mskD(ms).toISOString().slice(11,16);
const label=ms=>{const d=mskD(ms);return `${WD[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${hm(ms)}`};
let S=new Map(),week=0,sel=null,busy=false;

$("h").textContent=MGR?"Моё расписание":"Запись на бесплатный созвон";
$("ld").textContent=MGR?"Нажмите на свободную клетку, чтобы закрыть время, и ещё раз, чтобы открыть. Нажмите на день, чтобы закрыть или открыть его целиком. Тёмные клетки — записи: нажмите, чтобы увидеть, кто это.":"20 минут с менеджером: выслушаем и подскажем, с чего начать 💚 Выберите удобное время, время московское.";
$("lg").innerHTML=MGR?'<span><i style="background:#fff"></i>свободно</span><span><i style="background:var(--dark)"></i>запись</span><span><i style="background:var(--closed)"></i>вы закрыли</span><span><i style="background:var(--off)"></i>нерабочее</span>'
 :'<span><i style="background:#fff"></i>свободно</span><span><i style="background:var(--off)"></i>занято</span><span><i style="background:var(--green)"></i>ваш выбор</span>';
$("go").textContent=MGR?"Готово":"Записаться";$("go").disabled=!MGR;
$("pick").textContent=MGR?"Изменения сразу видят клиенты":"Нажмите на свободную клетку";

async function api(op,extra={}){
 if(DEMO)return demoApi(op,extra);
 const r=await fetch(API,{method:"POST",headers:{"content-type":"text/plain"},body:JSON.stringify({initData:INIT,op,mode:MGR?"mgr":"client",...extra})});
 return r.json();
}
/* демо без Telegram: часть слотов занята, у менеджера видны имена */
const FAKE=["Ольга, @olga_hr","Игорь, @igor_k","Марина","Дмитрий, @dima"];
function demoApi(op,x){const t0=Date.now(),d0=dayStart(t0);
 if(op==="slots"){const out=[];for(let i=0;i<14;i++){const ds=d0+i*DAY,we=[0,6].includes(mskD(ds).getUTCDay());for(let m=(we?12:10)*60;m+30<=(we?18:20)*60;m+=30){const s=ds+m*60000,b=((mskD(s).getUTCDate()*7+m/30*13)%10)<2;
   if(MGR){if(s<t0)continue;out.push(b?[s,"booked",FAKE[(m/30)%4],"Хочу сменить сферу"]:S.get(s)?.[0]==="closed"?[s,"closed"]:[s,"free"])}else if(!b&&s>=t0+2*3600000)out.push([s,"free"])}}return{ok:true,slots:out}}
 if(op==="book")return{ok:true};
 return{ok:true}}

async function load(){try{const r=await api("slots");if(!r.ok)throw r;S=new Map(r.slots.map(x=>[x[0],x.slice(1)]));render()}
 catch(e){$("grid").innerHTML=`<div class="msg" style="grid-column:1/-1">Не получилось загрузить расписание. Закройте экран и выберите время кнопками в чате 💚</div>`}}
function render(){const g=$("grid");g.innerHTML="";const t0=Date.now(),d0=dayStart(t0),wd=mskD(d0).getUTCDay();
 const mon=d0-((wd+6)%7)*DAY+week*7*DAY,days=[...Array(7)].map((_,i)=>mon+i*DAY),e=days[6],lim=d0+14*DAY;
 const a=mskD(mon),b=mskD(e);$("range").textContent=a.getUTCMonth()===b.getUTCMonth()?`${a.getUTCDate()}–${b.getUTCDate()} ${MON[b.getUTCMonth()]}`:`${a.getUTCDate()} ${MON[a.getUTCMonth()]} — ${b.getUTCDate()} ${MON[b.getUTCMonth()]}`;
 $("prev").disabled=week===0;$("next").disabled=mon+7*DAY>=lim;
 g.append(Object.assign(document.createElement("div"),{className:"dh"}));
 days.forEach(ds=>{const h=document.createElement("div"),d=mskD(ds),act=MGR&&ds>=d0&&ds<lim;h.className="dh"+(ds===d0?" today":"")+(act?" act":"");h.innerHTML=`${WD[d.getUTCDay()]}<b>${d.getUTCDate()}</b>`;
  if(act)h.onclick=()=>act&&toggleDay(ds);g.append(h)});
 for(let m=600;m<1200;m+=30){const t=document.createElement("div");t.className="tm";t.innerHTML=m%60===0?`${String(m/60).padStart(2,"0")}<sup>00</sup>`:"";g.append(t);
  days.forEach(ds=>{const s=ds+m*60000,v=S.get(s),c=document.createElement("button");c.className="c";c.textContent=hm(s);
   if(!v){c.disabled=true;c.textContent="";c.setAttribute("aria-hidden","true")}
   else if(v[0]==="free"){c.classList.add("free");if(sel===s)c.classList.add("sel");c.setAttribute("aria-label","Свободно: "+label(s));c.onclick=()=>MGR?toggle(s):pick(s)}
   else if(v[0]==="closed"){c.classList.add("closed");c.textContent="✕";c.setAttribute("aria-label","Закрыто: "+label(s));c.onclick=()=>toggle(s)}
   else if(v[0]==="booked"){c.classList.add("booked");c.textContent=String(v[1]||"").split(",")[0];c.onclick=()=>{$("pick").innerHTML="";const b=document.createElement("b");b.textContent=label(s);$("pick").append(b,"\n"+(v[1]||"")+(v[2]?`\nЗапрос: «${v[2]}»`:""))}}
   else if(v[0]==="hold"){c.classList.add("hold");c.textContent="…";c.onclick=()=>{$("pick").textContent=`${label(s)}: человек сейчас оформляет заявку на это время`}}
   g.append(c)})}}
function pick(s){sel=s;$("pick").innerHTML="";const b=document.createElement("b");b.textContent=label(s);$("pick").append("Вы выбрали: ",b);$("go").disabled=false;render()}
async function toggle(s){if(busy)return;busy=true;const v=S.get(s);const close=v[0]==="free";
 const r=await api("toggle",{ms:s,close}).catch(()=>({ok:false}));busy=false;
 if(!r.ok){$("pick").textContent="Не получилось, попробуйте ещё раз";return}
 S.set(s,[close?"closed":"free"]);$("pick").textContent=`${label(s)}: ${close?"закрыто, клиенты это время не увидят":"снова открыто"}`;render()}
async function toggleDay(ds){if(busy)return;const own=[...S.entries()].filter(([s,v])=>s>=ds&&s<ds+DAY&&["free","closed"].includes(v[0]));if(!own.length)return;
 const close=own.some(([,v])=>v[0]==="free");busy=true;const r=await api("toggleDay",{day:ds,close}).catch(()=>({ok:false}));busy=false;
 if(!r.ok){$("pick").textContent="Не получилось, попробуйте ещё раз";return}
 own.forEach(([s])=>S.set(s,[close?"closed":"free"]));const d=mskD(ds);$("pick").textContent=`${WD[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]}: ${close?"день закрыт, записи, которые уже были, остались":"день снова открыт"}`;render()}
$("prev").onclick=()=>{week--;render()};$("next").onclick=()=>{week++;render()};
$("go").onclick=async()=>{
 if(MGR){if(TG&&INIT)TG.close();return}
 if(!sel||busy)return;busy=true;$("go").disabled=true;$("go").textContent="Записываем…";
 const r=await api("book",{ms:sel}).catch(()=>({ok:false}));busy=false;
 if(r.ok){$("grid").innerHTML=`<div class="msg" style="grid-column:1/-1"><b style="color:var(--dark);font-size:18px">Вы записаны 💚</b><br>${label(sel)} по Москве.<br>Возвращаем вас в чат: там бот спросит, как с вами связаться.</div>`;$("go").hidden=true;$("pick").textContent="";
  setTimeout(()=>{if(TG&&INIT)TG.close()},1600)}
 else{$("go").textContent="Записаться";$("pick").textContent=r.error||"Это время только что заняли. Выберите, пожалуйста, другое 💚";sel=null;load()}};
if(DEMO)$("demo").hidden=false;
load();
</script>
</body>
</html>
